<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Post</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="feed-page">
    <!-- 
        ====================================================
        MEMBER 2: Implement Single Post View in feed.js
        - Show single post with full details
        - Display comments
        ====================================================
    -->

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="feed.html" class="logo">nexus</a>
            </div>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="feed.html">Home</a>
                    <a href="profile.html">Profile</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Feed Container -->
    <div class="feed-container">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar left-sidebar">
            <div class="sidebar-card" id="sidebarSummary">
                <h3>Welcome back</h3>
                <p>See what friends are sharing and stay connected with live activity.</p>
                <div class="sidebar-meta">
                    <div><strong id="followingCount">0</strong> Following</div>
                    <div><strong id="onlineCount">0</strong> Online</div>
                </div>
            </div>

            <div class="sidebar-card">
                <h3>Trending</h3>
                <ul class="trending-list" id="trendingList"></ul>
            </div>
        </aside>

        <!-- MAIN FEED -->
        <main class="feed-main">
            <form id="createPostForm">
                <textarea id="postContent" placeholder="What's happening?" required></textarea>

                <div class="post-actions-row">
                    <button type="submit">Post</button>
                </div>

                <div class="feed-divider"></div>
            </form>

            <div id="postsContainer"></div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar right-sidebar">
            <div class="sidebar-card">
                <h3>Active now</h3>
                <ul class="online-list" id="onlineList"></ul>
            </div>

            <div class="sidebar-card">
                <h3>Who to follow</h3>
                <ul class="suggestions-list" id="suggestionsList"></ul>
            </div>
        </aside>
    </div>

    <!-- Core scripts (Member 1) -->
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>

    <!-- Member 3: Comments and interactions -->
    <script src="../js/interactions.js"></script>

    <!-- Member 2: All post functionality (feed AND single post) -->
    <script src="../js/feed.js"></script>

</body>

</html>
